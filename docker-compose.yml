services:
  proxy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: limen
    restart: unless-stopped
    network_mode: host
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - /home/keraki/.config/limen/Caddyfile:/etc/caddy/Caddyfile:ro
      - /home/keraki/.config/limen/errors:/srv/errors:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      auth:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8088"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 64m

  auth:
    build: ./auth
    image: limen-core:latest
    container_name: limen-core
    restart: unless-stopped
    network_mode: host
    user: "1000:1000"
    environment:
      PORT: "8099"
      TZ: "Asia/Jakarta"
    volumes:
      - /home/keraki/.config/limen/auth/data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8099/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 128m

volumes:
  caddy_data:
  caddy_config:
